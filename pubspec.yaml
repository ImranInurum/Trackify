name: trackify
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.29+46

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.1.0
  animated_notch_bottom_bar: ^1.0.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.0
  fpdart: ^1.2.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_svg: ^2.0.9
  google_fonts: 5.1.0
  cached_network_image: ^3.3.1
  dropdown_button2: ^2.3.9
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.2
  firebase_auth: ^4.16.0
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0
  image_picker: ^1.0.7
  http_parser: ^4.0.2
  mobile_scanner: ^3.5.7
  polyline_codec: ^0.1.6
  socket_io_client: ^2.0.3
  geocoding: ^3.0.0
  video_player: ^2.7.2
  chewie: ^1.7.0
  youtube_player_flutter: ^9.0.4
#  file_picker: ^8.0.0
#  image_cropper: ^12.2.1
  flutter_image_compress: ^2.1.0
  file_picker: ^6.1.1
  image_cropper: ^5.0.0
  url_launcher: ^6.1.14
  webview_flutter: ^4.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.0.0
  country_state_city: ^0.1.6
  flutter_tts: ^3.8.5
  app_settings: ^5.1.1
  device_info_plus: ^9.0.0
  lottie: ^2.6.0
  razorpay_flutter: ^1.4.5
  share_plus: ^7.2.2
  app_links: ^3.5.0
  package_info_plus: ^4.2.0
  in_app_update: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to 
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/map_styles/light_map.json
    - assets/map_styles/dark_map.json
    - assets/map_styles/full_map_style.json
    - assets/images/
    - assets/icons/
    - assets/lottie/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
     - family: Montserrat
       fonts:
         - asset: assets/fonts/Montserrat-Bold.ttf
           weight: 700
         - asset: assets/fonts/Montserrat-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/Montserrat-Regular.ttf
           weight: 500
         - asset: assets/fonts/Montserrat-Medium.ttf
           weight: 400
         - asset: assets/fonts/Montserrat-Light.ttf
           weight: 300
         - asset: assets/fonts/Montserrat-Thin.ttf
           weight: 200
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
